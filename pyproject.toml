[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ldapgrep"
version = "2.3.1"
description = "grep your company's Active Directory / LDAP: users, groups, memberships - CLI and console GUI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PhilippCHBE" }]
keywords = ["ldap", "active-directory", "cli", "tui", "sysadmin"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration :: Authentication/Directory :: LDAP",
]
dependencies = [
    "ldap3>=2.9.1",
    "pyasn1>=0.6.4",
    "rich>=13.0",
]

[project.optional-dependencies]
tui = ["textual>=0.80", "pyperclip>=1.8"]
dev = ["pytest>=7", "textual>=0.80", "cryptography>=43"]

[project.scripts]
ldapgrep = "ldapgrep.cli:main"

[project.urls]
Homepage = "https://github.com/PhilippCHBE/ldap-grep"
Repository = "https://github.com/PhilippCHBE/ldap-grep"
Issues = "https://github.com/PhilippCHBE/ldap-grep/issues"

[tool.setuptools]
packages = ["ldapgrep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
