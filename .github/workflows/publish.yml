name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Validate release tag, version and main ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import ast, os, re, subprocess, tomllib
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("Only stable vX.Y.Z tags may publish")
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          module = ast.parse(Path("ldapgrep/__init__.py").read_text())
          runtime = next(ast.literal_eval(n.value) for n in module.body
                         if isinstance(n, ast.Assign) and any(
                             isinstance(t, ast.Name) and t.id == "__version__" for t in n.targets))
          if tag != "v" + version or runtime != version:
              raise SystemExit("Release tag and package versions differ")
          subprocess.run(["git", "merge-base", "--is-ancestor", "HEAD", "origin/main"], check=True)
          PY
      - run: python -m pip install ".[dev]" build twine pip-audit
      - run: python -m pytest -q
      - run: python -m pip_audit --local
      - run: python scripts/install_gitleaks.py
      - run: python scripts/secret_scan.py history
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  pypi:
    # Enable only after configuring the new repository's environment and PyPI publisher.
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
